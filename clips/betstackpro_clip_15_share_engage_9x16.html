<script>
(function(){
  var clip=document.querySelector('.bsp-clip'); if(!clip) return;
  var scene=clip.querySelector('.scene');
  function run(){
    scene.querySelectorAll('[data-count]').forEach(function(el){var to=parseFloat(el.dataset.count),dec=parseInt(el.dataset.dec||0),suf=el.dataset.suffix||'';var t0=performance.now(),dur=1400;function tick(t){var p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=(to*e).toFixed(dec)+suf;if(p<1)requestAnimationFrame(tick);}requestAnimationFrame(tick);});
    var sc=scene.querySelector('.scramble');
    if(sc){var fin=sc.dataset.final,ch='ABCDEFGHJKLMNPQRSTUVWXYZ0123456789-';var f=0;var iv=setInterval(function(){f++;sc.textContent=fin.split('').map(function(c,i){return i<(f-6)?c:ch[Math.floor(Math.random()*ch.length)];}).join('');if(f>fin.length+6){clearInterval(iv);sc.textContent=fin;}},55);}
  }
  function replay(){scene.style.display='none';void scene.offsetWidth;scene.style.display='flex';run();}
  run(); setInterval(replay,6500);
})();
</script>
